name: Sync FongMi APK & Push Telegram (Stable)

on:
  #schedule:
  #  - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装必要工具
        run: |
          sudo apt-get update
          sudo apt-get install -y jq coreutils opencc

      # ========== 核心改动：从 Releases API 获取最新版本 ==========
      - name: 获取最新 GitHub Release 信息
        id: release
        run: |
          # 获取最新 release 的完整 JSON
          curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/FongMi/Release/releases/latest \
            -o release.json

          # 版本号
          version=$(jq -r '.tag_name // .name // "未知版本"' release.json)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "当前版本: $version"

          # 更新日志（body），清洗后繁转简
          body=$(jq -r '.body // ""' release.json)
          # 去掉开头的 # 标题行、多余空行，统一变成 • 列表
          cleaned=$(echo "$body" \
            | sed 's/\r//g' \
            | sed '/^# /d' \
            | sed 's/^\* /• /g' \
            | sed '/^$/d' \
            | opencc -c t2s.json)

          update_time=$(TZ=Asia/Shanghai date '+%Y/%m/%d %H:%M')

          caption=$(
            printf "\n\n - 影视 · 蜂蜜版\n\n- 本次更新：\n%s\n\n - 当前版本：%s\n - 更新时间：%s" \
              "$cleaned" "$version" "$update_time"
          )

          {
            echo "caption<<EOF"
            echo "$caption"
            echo "EOF"
          } >> $GITHUB_ENV

          # 把 assets 信息也存下来，方便后面下载
          jq -c '.assets' release.json > assets.json
          echo "assets 数量: $(jq 'length' assets.json)"

      - name: 下载最新 Release 的 APK
        run: |
          mkdir -p apk
          # 需要的 4 个文件
          for name in \
            "leanback-arm64_v8a.apk" \
            "leanback-armeabi_v7a.apk" \
            "mobile-arm64_v8a.apk" \
            "mobile-armeabi_v7a.apk"; do
            
            url=$(jq -r --arg n "$name" '.[] | select(.name==$n) | .browser_download_url' assets.json)
            if [ -z "$url" ] || [ "$url" = "null" ]; then
              echo "错误：找不到 $name"
              exit 1
            fi
            echo "下载 $name ..."
            curl -sL -o "apk/$name" "$url"
          done

          echo "已下载的 APK："
          ls -lh apk/

      # ========== 以下逻辑基本保持原样 ==========
      - name: 计算当前所有 APK 的 hash
        id: hash
        run: |
          if ls apk/*.apk >/dev/null 2>&1; then
            hash=$(find apk -type f -name "*.apk" -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sha256sum | cut -d' ' -f1)
          else
            hash="no-apk-$(date +%s)"
          fi
          echo "hash=$hash" >> $GITHUB_OUTPUT

      - name: 读取上一次 hash
        id: last
        run: |
          last=$(cat last_hash.txt 2>/dev/null || echo "")
          echo "last=$last" >> $GITHUB_OUTPUT

      - name: 判断是否有更新
        id: check
        run: |
          if [ "${{ steps.hash.outputs.hash }}" = "${{ steps.last.outputs.last }}" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No change detected → skipping push / release"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Change detected → will create release & push to Telegram"
          fi

      - name: 保存新 hash 并提交到仓库
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ steps.hash.outputs.hash }}" > last_hash.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_hash.txt
          if git diff --staged --quiet; then
            echo "No change in last_hash.txt, skip commit"
          else
            git commit -m "chore: update last_hash for FongMi sync (new APK(s))"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: 生成 release tag
        if: steps.check.outputs.changed == 'true'
        id: tag
        run: |
          tag="auto-$(date +'%Y%m%d-%H%M')"
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: 创建 GitHub Release 并上传所有 APK
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.tag.outputs.tag }}" || true
          git push origin "${{ steps.tag.outputs.tag }}" || true

          gh release create "${{ steps.tag.outputs.tag }}" \
            apk/*.apk \
            --title "FongMi APK ${{ steps.tag.outputs.tag }}" \
            --notes "自动同步自：https://github.com/FongMi/Release/releases\n版本：${{ steps.release.outputs.version }}\n仅当 APK 内容发生变化时发布。" \
            || echo "Release 可能已存在，跳过创建"

      - name: 推送到 Telegram（使用 jq 构造 JSON）
        if: steps.check.outputs.changed == 'true'
        env:
          BOT_TOKEN:   ${{ secrets.BOT_TOKEN }}
          CHAT_ID:     ${{ secrets.CHAT_ID }}
          BOT_API_BASE: ${{ secrets.BOT_API_BASE }}
        run: |
          for f in \
            "leanback-arm64_v8a.apk" \
            "leanback-armeabi_v7a.apk" \
            "mobile-arm64_v8a.apk" \
            "mobile-armeabi_v7a.apk"; do
            if [ ! -f "apk/$f" ]; then
              echo "错误：缺少文件 apk/$f，无法推送 Telegram"
              exit 1
            fi
          done

          media=$(jq -n --arg cap "${{ env.caption }}" '
            [
              {"type":"document","media":"attach://leanback-arm64_v8a.apk"},
              {"type":"document","media":"attach://leanback-armeabi_v7a.apk"},
              {"type":"document","media":"attach://mobile-arm64_v8a.apk"},
              {"type":"document","media":"attach://mobile-armeabi_v7a.apk","caption":$cap}
            ]
          ')

          response=$(curl -s -X POST "$BOT_API_BASE/bot$BOT_TOKEN/sendMediaGroup" \
            -F chat_id="$CHAT_ID" \
            -F media="$media" \
            -F "leanback-arm64_v8a.apk=@apk/leanback-arm64_v8a.apk" \
            -F "leanback-armeabi_v7a.apk=@apk/leanback-armeabi_v7a.apk" \
            -F "mobile-arm64_v8a.apk=@apk/mobile-arm64_v8a.apk" \
            -F "mobile-armeabi_v7a.apk=@apk/mobile-armeabi_v7a.apk")

          echo "Telegram 响应: $response"

          if echo "$response" | grep -q '"ok":true'; then
            echo "Telegram 推送成功"
          else
            echo "Telegram 推送失败，请检查响应内容"
            exit 1
          fi
